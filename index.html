<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi — Rekayasa Perangkat Lunak II</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
:root{
  --navy-900:#0A1226;--navy-800:#101A33;--navy-700:#1B2A4E;
  --royal-500:#2B4EBA;--royal-400:#4A6FE0;
  --powder-100:#EEF4FF;--powder-200:#D6E4FF;--powder-300:#B8CCF5;
  --gold-500:#D4AF6A;--gold-400:#E4C889;
  --off-white:#F8FAFF;--ink:#0B1733;--ink-soft:#3E4C6B;--muted:#7A88A6;
  --line:#E4EBF7;--line-soft:#F0F4FB;
  --green:#12B76A;--green-soft:#E7F8F0;
  --amber:#F79009;--amber-soft:#FFF4E5;
  --red:#E5484D;--red-soft:#FEECEC;
  --r-md:16px;--r-lg:22px;--r-xl:28px;--r-2xl:36px;--r-pill:999px;
  --sh-sm:0 4px 14px rgba(16,26,51,.06);
  --sh-md:0 12px 28px -6px rgba(16,26,51,.10);
  --sh-lg:0 28px 60px -18px rgba(16,26,51,.22);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);background:var(--off-white);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:'Poppins',sans-serif;letter-spacing:-.02em;font-weight:700}
button,input,select{font-family:inherit}
a{color:inherit;text-decoration:none}
.bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-decor .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
.bg-decor .blob.b1{width:520px;height:520px;background:#D6E4FF;top:-180px;left:-160px}
.bg-decor .blob.b2{width:460px;height:460px;background:#F4E9CE;bottom:-200px;right:-140px;opacity:.5}
.grid-lines{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(43,78,186,.05) 1px, transparent 1px),linear-gradient(90deg, rgba(43,78,186,.05) 1px, transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 70%)}
#app{position:relative;z-index:1;min-height:100vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:var(--r-pill);font-weight:600;font-size:14px;border:none;cursor:pointer;transition:all .25s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--royal-500),var(--royal-400));color:#fff;box-shadow:0 10px 24px -8px rgba(43,78,186,.55)}
.btn-primary:hover{transform:translateY(-2px)}
.btn-outline{background:#fff;color:var(--navy-800);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--royal-400);color:var(--royal-500);background:var(--powder-100)}
.btn-navy{background:linear-gradient(135deg,var(--navy-800),var(--navy-700));color:#fff;box-shadow:0 10px 24px -10px rgba(16,26,51,.7)}
.btn-navy:hover{transform:translateY(-2px)}
.btn-danger{background:linear-gradient(135deg,#E5484D,#C93A3E);color:#fff}
.btn-danger:hover{transform:translateY(-2px)}
.btn-block{width:100%}
.btn-sm{padding:9px 16px;font-size:12.5px}
.btn-lg{padding:16px 30px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.navbar{position:sticky;top:0;z-index:50;padding:18px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(248,250,255,.75);backdrop-filter:blur(14px);border-bottom:1px solid rgba(228,235,247,.6)}
.nav-logo{display:flex;align-items:center;gap:12px}
.nav-logo .logo-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--navy-800),var(--royal-500));color:#fff;display:grid;place-items:center;font-size:17px}
.nav-logo h1{font-size:16px;font-weight:700;color:var(--navy-800)}
.nav-logo p{font-size:11px;color:var(--muted);font-weight:500}
.nav-links{display:flex;gap:6px;align-items:center}
.nav-links a{padding:9px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:500;color:var(--ink-soft);transition:all .2s;cursor:pointer}
.nav-links a:hover{color:var(--navy-800);background:var(--powder-100)}

.hero{max-width:1280px;margin:0 auto;padding:64px 40px 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:var(--r-pill);background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--navy-700);margin-bottom:22px}
.hero-badge .dot{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--royal-500),var(--royal-400));color:#fff;display:grid;place-items:center;font-size:10px}
.hero h2{font-size:clamp(36px,5vw,58px);font-weight:800;line-height:1.05;letter-spacing:-.035em;color:var(--navy-900);margin-bottom:20px}
.hero h2 .grad{background:linear-gradient(120deg,var(--royal-500),#6E8EF0 40%,var(--gold-500));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:16.5px;color:var(--ink-soft);line-height:1.6;max-width:520px;margin-bottom:32px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px}
.hero-stats{display:flex;gap:32px;padding-top:28px;border-top:1px solid var(--line)}
.hero-stats .stat-item h4{font-size:24px;color:var(--navy-900);font-weight:800}
.hero-stats .stat-item p{font-size:12.5px;color:var(--muted);font-weight:500}
.hero-visual{position:relative;height:520px}
.visual-card{position:absolute;background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-lg);border:1px solid var(--line);overflow:hidden}
.visual-card.main{top:20px;left:20px;right:60px;bottom:80px;padding:24px;background:linear-gradient(160deg,#fff 0%,#F4F8FF 100%);animation:floatY 6s ease-in-out infinite}
.visual-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.visual-head .dots{display:flex;gap:5px}
.visual-head .dots span{width:9px;height:9px;border-radius:50%;background:#D8E1F0}
.visual-head .dots span:nth-child(1){background:#FF6058}
.visual-head .dots span:nth-child(2){background:#FFBD2E}
.visual-head .dots span:nth-child(3){background:#28CA42}
.visual-title{font-size:12px;font-weight:600;color:var(--muted)}
.visual-qr{width:140px;height:140px;border-radius:20px;background:#fff;padding:14px;box-shadow:var(--sh-md);display:grid;place-items:center;margin:8px auto 18px;border:1px solid var(--line)}
.visual-qr .qr-box{width:100%;height:100%;background-image:repeating-linear-gradient(0deg,#101A33 0 4px,transparent 4px 8px),repeating-linear-gradient(90deg,#101A33 0 4px,transparent 4px 8px);background-size:8px 8px;opacity:.85;border-radius:6px;-webkit-mask-image:radial-gradient(circle,#000 60%,transparent 100%);mask-image:radial-gradient(circle,#000 60%,transparent 100%)}
.visual-info{background:#fff;border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.visual-info .row{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}
.visual-info .row span:first-child{color:var(--muted)}
.visual-info .row span:last-child{font-weight:600;color:var(--navy-800)}
.float-card{position:absolute;background:#fff;border-radius:18px;box-shadow:var(--sh-lg);border:1px solid var(--line);padding:14px 16px;display:flex;gap:12px;align-items:center;animation:floatY 5s ease-in-out infinite}
.float-card.c1{top:-6px;right:-10px;animation-delay:.5s}
.float-card.c2{bottom:40px;left:-30px;animation-delay:1.2s}
.float-card.c3{bottom:-10px;right:30px;animation-delay:.9s}
.float-card .fc-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:15px;flex-shrink:0}
.float-card.c1 .fc-icon{background:linear-gradient(135deg,#12B76A,#0E9B58)}
.float-card.c2 .fc-icon{background:linear-gradient(135deg,var(--royal-500),var(--royal-400))}
.float-card.c3 .fc-icon{background:linear-gradient(135deg,var(--gold-500),var(--gold-400));color:#2A1F00}
.float-card h5{font-size:13px;font-weight:700;color:var(--navy-900)}
.float-card p{font-size:11px;color:var(--muted);font-weight:500}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.roles-section{max-width:1280px;margin:0 auto;padding:20px 40px 100px}
.section-head{text-align:center;max-width:600px;margin:0 auto 44px}
.section-head .eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--royal-500);margin-bottom:12px}
.section-head h3{font-size:32px;font-weight:800;color:var(--navy-900);margin-bottom:12px}
.section-head p{color:var(--ink-soft);font-size:15px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.role-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-2xl);padding:36px 32px;cursor:pointer;transition:all .35s}
.role-card:hover{transform:translateY(-6px);box-shadow:var(--sh-lg);border-color:var(--powder-300)}
.role-card .rc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.role-card .rc-icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:26px;color:#fff}
.role-card[data-role="student"] .rc-icon{background:linear-gradient(135deg,var(--navy-800),var(--royal-500))}
.role-card[data-role="admin"] .rc-icon{background:linear-gradient(135deg,var(--gold-500),#B8934E);color:#2A1F00}
.role-card .rc-tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:var(--r-pill)}
.role-card[data-role="student"] .rc-tag{background:var(--powder-100);color:var(--royal-500)}
.role-card[data-role="admin"] .rc-tag{background:#FBF3E0;color:#8A6B1F}
.role-card h4{font-size:22px;font-weight:800;color:var(--navy-900);margin-bottom:8px}
.role-card p{color:var(--ink-soft);font-size:14px;line-height:1.55;margin-bottom:24px}
.role-card .rc-features{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.role-card .rc-features div{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-soft)}
.role-card .rc-features i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:10px;flex-shrink:0}
.role-card .rc-cta{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--royal-500)}
.role-card[data-role="admin"] .rc-cta{color:#8A6B1F}

.page-shell{max-width:980px;margin:0 auto;padding:40px}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:32px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;padding:10px 18px;border-radius:var(--r-pill);background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.step .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-size:11.5px;font-weight:700}
.step.active{background:linear-gradient(135deg,var(--navy-800),var(--royal-500));color:#fff;border-color:transparent}
.step.active .num{background:rgba(255,255,255,.22);color:#fff}
.step.done{background:var(--green-soft);color:#0E7A47;border-color:transparent}
.step.done .num{background:var(--green);color:#fff}
.step-line{width:36px;height:2px;background:var(--line);border-radius:2px}
.step-line.done{background:var(--green)}

.form-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-2xl);padding:40px;box-shadow:var(--sh-md)}
.form-card-head{display:flex;gap:16px;align-items:center;margin-bottom:32px}
.form-card-head .ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy-800),var(--royal-500));color:#fff;font-size:22px;flex-shrink:0}
.form-card-head h3{font-size:22px;font-weight:800;color:var(--navy-900)}
.form-card-head p{font-size:13.5px;color:var(--muted);margin-top:2px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy-800);margin-bottom:8px}
.field label .req{color:var(--red);margin-left:2px}
.input-wrap{position:relative}
.input-wrap i.pre{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.input{width:100%;padding:15px 18px 15px 46px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--off-white);font-size:14.5px;color:var(--ink);font-weight:500;transition:all .2s;outline:none}
.input::placeholder{color:#A5B0C5;font-weight:400}
.input:focus{border-color:var(--royal-400);background:#fff;box-shadow:0 0 0 4px rgba(43,78,186,.1)}
.alert{display:none;gap:10px;padding:14px 18px;border-radius:var(--r-md);font-size:13.5px;margin-bottom:22px;align-items:flex-start}
.alert.show{display:flex}
.alert-error{background:var(--red-soft);color:#8A2024;border:1px solid #F8C8C8}
.alert-info{background:var(--powder-100);color:var(--navy-700);border:1px solid var(--powder-200)}
.alert-success{background:var(--green-soft);color:#0E7A47;border:1px solid #A7E6C6}

.qr-result{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.qr-ticket{background:linear-gradient(160deg,var(--navy-800) 0%,var(--navy-700) 60%,var(--royal-500) 140%);border-radius:var(--r-2xl);padding:32px;color:#fff;box-shadow:var(--sh-lg)}
.qr-ticket .tick-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.qr-ticket .tick-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#12B76A,#0E9B58);font-size:22px;color:#fff}
.qr-ticket h3{font-size:19px;font-weight:800}
.qr-ticket p{font-size:12.5px;opacity:.75;margin-top:2px}
.ticket-info{margin-bottom:24px}
.ticket-info .trow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-size:13.5px}
.ticket-info .trow:last-child{border-bottom:none}
.ticket-info .trow span:first-child{opacity:.7;font-weight:500}
.ticket-info .trow span:last-child{font-weight:600;text-align:right;max-width:65%}
.qr-holder{background:#fff;border-radius:var(--r-xl);padding:22px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#qrcode{display:inline-flex;padding:12px;background:#fff;border-radius:16px;min-height:204px;min-width:204px;align-items:center;justify-content:center}
#qrcode canvas, #qrcode img{display:block;border-radius:8px;max-width:100%;height:auto}
.qr-holder .qr-hint{font-size:11.5px;color:var(--muted);margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500}
.qr-loading{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.qr-loading .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--royal-500);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.qr-side-info{display:flex;flex-direction:column;gap:16px}
.info-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-sm)}
.info-card h4{font-size:14px;font-weight:700;color:var(--navy-900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.info-card h4 i{color:var(--royal-500)}
.info-card ul{list-style:none;display:flex;flex-direction:column;gap:12px}
.info-card li{display:flex;gap:10px;font-size:13px;color:var(--ink-soft);line-height:1.5}
.info-card li i{color:var(--green);font-size:14px;margin-top:2px;flex-shrink:0}
.info-card .small-muted{font-size:12.5px;color:var(--muted);line-height:1.6}

.video-container{position:relative;width:100%;border-radius:var(--r-lg);overflow:hidden;background:#000;aspect-ratio:1/1;box-shadow:var(--sh-lg);border:2px solid var(--navy-800)}
.video-container video{width:100%;height:100%;object-fit:cover;display:block}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame{position:relative;width:70%;aspect-ratio:1/1}
.scan-frame .corner{position:absolute;width:36px;height:36px;border:3px solid #4A6FE0;box-shadow:0 0 14px rgba(74,111,224,.9)}
.corner.tl{top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.corner.tr{top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.corner.bl{bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.corner.br{bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#4A6FE0,transparent);box-shadow:0 0 14px 2px rgba(74,111,224,.9);animation:scanMove 2.2s ease-in-out infinite}
@keyframes scanMove{0%,100%{top:12%;opacity:.4}50%{top:88%;opacity:1}}

.admin-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--navy-900) 0%,var(--navy-800) 60%,#15224A 100%);color:#fff;padding:28px 20px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo .mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--royal-500),var(--royal-400));font-size:16px}
.sb-logo h1{font-size:15px;font-weight:700}
.sb-logo p{font-size:11px;color:rgba(255,255,255,.55);font-weight:500}
.sb-menu{display:flex;flex-direction:column;gap:4px}
.sb-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;color:rgba(255,255,255,.72);cursor:pointer;transition:all .2s}
.sb-item i{font-size:15px;width:20px;text-align:center}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.active{background:linear-gradient(135deg,rgba(43,78,186,.9),rgba(74,111,224,.7));color:#fff}
.sb-footer{margin-top:auto}
.sb-user{display:flex;align-items:center;gap:11px;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.sb-user .avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--gold-500),var(--gold-400));color:#2A1F00;display:grid;place-items:center;font-size:14px;font-weight:700}
.sb-user h5{font-size:13px;font-weight:700;color:#fff}
.sb-user p{font-size:11px;color:rgba(255,255,255,.55);font-weight:500}
.sb-logout{width:100%;margin-top:12px;padding:11px;border-radius:var(--r-md);background:rgba(229,72,77,.15);border:1px solid rgba(229,72,77,.3);color:#FF9A9E;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;font-family:inherit}
.sb-logout:hover{background:rgba(229,72,77,.28);color:#fff}
.admin-main{padding:28px 36px 40px;background:var(--off-white);min-height:100vh}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:20px;flex-wrap:wrap}
.admin-greeting h2{font-size:24px;font-weight:800;color:var(--navy-900)}
.admin-greeting h2 span{color:var(--royal-500)}
.admin-greeting p{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px}
.admin-actions{display:flex;gap:10px;align-items:center}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}
.summary-card{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-xl);padding:22px;transition:all .3s}

</head>
<body>

<div class="bg-decor"><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="grid-lines"></div>
<div class="toast-container" id="toastContainer"></div>
<div id="app"></div>

<script>
/*******************************************************
 * CONFIG & STATE
 *******************************************************/
const MATAKULIAH = 'Rekayasa Perangkat Lunak II';

// ⚠️ GANTI DENGAN URL DEPLOY APPS SCRIPT ANDA
const API_URL = 'https://script.google.com/macros/s/AKfycbyqpXG9Nctdk4JKLCjvuDZN71rHPz39AzZ3wIuVHSH0fE5tMvDZHUskh2IYWLilINVw/exec';

// Deteksi page dari URL query string (bisa jalan di localhost / hosting apa saja)
const SERVER_PAGE = (function(){
  const params = new URLSearchParams(window.location.search);
  return params.get('page') || 'index';
})();

const state = {
  view: 'landing',
  user: null,
  authToken: sessionStorage.getItem('authToken') || null,
  authRole: sessionStorage.getItem('authRole') || null,
  lastAbsen: null,
  attendanceCache: [],
  studentsCache: [],
  selectedDate: new Date().toISOString().slice(0,10),
  adminTab: 'dashboard',
  qrToken: null,
  sessionId: null,
  expiredAt: null,
  countdownTimer: null,
  videoStream: null,
  scanLoop: null,
  verifiedStudent: null
};

/*******************************************************
 * WRAPPER API — panggil Apps Script via fetch
 *******************************************************/
async function callServer(action, params) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, params: params || {} }),
      redirect: 'follow'
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    return json;
  } catch (err) {
    console.error('API error:', err);
    return { success: false, message: 'Koneksi gagal: ' + err.message };
  }
}

/*******************************************************
 * TOAST
 *******************************************************/
function toast(msg, type='success', title=null){
  const c = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = {success:'fa-circle-check', error:'fa-circle-xmark', warning:'fa-triangle-exclamation'};
  const titles = {success:'Berhasil', error:'Gagal', warning:'Perhatian'};
  el.innerHTML = `<div class="t-ic"><i class="fas ${icons[type]}"></i></div><div class="t-body"><strong>${title || titles[type]}</strong><p>${msg}</p></div>`;
  c.appendChild(el);
  setTimeout(() => { el.style.transition = 'all .3s'; el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; setTimeout(() => el.remove(), 300); }, 3400);
}

/*******************************************************
 * HELPERS
 *******************************************************/
function formatTanggal(dateStr){
  if(!dateStr) return '-';
  return new Date(dateStr).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
function formatTanggalShort(dateStr){
  if(!dateStr) return '-';
  return new Date(dateStr).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
}
function hitungPertemuan(dateStr){
  if(!dateStr) return 'Pertemuan 1';
  const d = new Date(dateStr);
  return 'Pertemuan ' + ((d.getDate()%4)+1);
}
function initialOf(name){ return (name||'M').split(' ').map(n=>n[0]).join('').slice(0,2).toUpperCase(); }
function getGreeting(){
  const h = new Date().getHours();
  if(h<11) return 'Selamat pagi';
  if(h<15) return 'Selamat siang';
  if(h<18) return 'Selamat sore';
  return 'Selamat malam';
}
function esc(str){ return String(str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/*******************************************************
 * QR GENERATOR (client-side)
 *******************************************************/
async function generateQR(container, content, size=220){
  container.innerHTML = '<div class="qr-loading"><div class="spinner"></div><span>Membuat QR...</span></div>';
  if(typeof QRCode !== 'undefined' && typeof QRCode.toCanvas === 'function'){
    try{
      const canvas = document.createElement('canvas');
      await QRCode.toCanvas(canvas, content, {width:size, margin:1, color:{dark:'#101A33',light:'#ffffff'}, errorCorrectionLevel:'H'});
      container.innerHTML = '';
      container.appendChild(canvas);
      return true;
    } catch(err){ console.warn('QRCode gagal:', err); }
  }
  try{
    const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(content)}&color=101A33&bgcolor=ffffff&qzone=1`;
    const img = new Image();
    img.alt = 'QR Code'; img.width = size; img.height = size;
    img.style.borderRadius = '8px'; img.style.display = 'block';
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = apiUrl; });
    container.innerHTML = '';
    container.appendChild(img);
    return true;
  } catch(err){
    container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--red)"><i class="fas fa-triangle-exclamation" style="font-size:28px;margin-bottom:10px"></i><p style="font-size:12.5px;font-weight:600">Gagal membuat QR</p></div>`;
    return false;
  }
}

/*******************************************************
 * ROUTER
 *******************************************************/
function render(view){
  state.view = view;
  const app = document.getElementById('app');
  window.scrollTo({top:0,behavior:'smooth'});
  stopCamera();
  if(state.countdownTimer){ clearInterval(state.countdownTimer); state.countdownTimer = null; }

  switch(view){
    case 'landing':       app.innerHTML = viewLanding(); break;
    case 'student-form':  app.innerHTML = viewStudentForm(); break;
    case 'student-scan':  app.innerHTML = viewStudentScan(); startCamera(); break;
    case 'student-done':  app.innerHTML = viewStudentDone(); break;
    case 'admin-login':   app.innerHTML = viewAdminLogin(); break;
    case 'admin-dash':    app.innerHTML = viewAdminDash(); initAdmin(); break;
  }
}

/*******************************************************
 * LANDING
 *******************************************************/

    <section class="hero">

        <div class="hero-cta">

          <button class="btn btn-outline btn-lg" onclick="startAdmin()"><i class="fas fa-chart-line"></i> Dashboard Dosen</button>
        </div>
        <div class="hero-stats">
          <div class="stat-item"><h4>99.9%</h4><p>Akurasi Data</p></div>
          <div class="stat-item"><h4>&lt; 3s</h4><p>Waktu Scan</p></div>
          <div class="stat-item"><h4>1 QR</h4><p>Per Pertemuan</p></div>
        </div>
      </div>
      <div class="hero-visual">
        <div class="visual-card main">
          <div class="visual-head"><div class="dots"><span></span><span></span><span></span></div><div class="visual-title">lecturer.screen</div></div>
          <div class="visual-qr"><div class="qr-box"></div></div>
          <div class="visual-info">
            <div class="row"><span>Sesi</span><span>SES-20250101</span></div>
            <div class="row"><span>Berlaku</span><span>30 menit</span></div>
            <div class="row"><span>Mata Kuliah</span><span>RPL II</span></div>
            <div class="row"><span>Status</span><span style="color:#12B76A">● Aktif</span></div>
          </div>
        </div>
        <div class="float-card c1"><div class="fc-icon"><i class="fas fa-check"></i></div><div><h5>Absensi Masuk</h5><p>Baru saja · 08:15</p></div></div>
        <div class="float-card c2"><div class="fc-icon"><i class="fas fa-users"></i></div><div><h5>128 Mahasiswa</h5><p>Hadir hari ini</p></div></div>
        <div class="float-card c3"><div class="fc-icon"><i class="fas fa-trophy"></i></div><div><h5>98% Kehadiran</h5><p>Pekan ini</p></div></div>
      </div>
    </section>
    <section class="roles-section">
      <div class="section-head">
        <span class="eyebrow">Pilih Peran Anda</span>
        <h3>Mulai Dalam Satu Klik</h3>
        <p>Pilih salah satu peran di bawah untuk mengakses sistem absensi.</p>
      </div>
      <div class="role-grid">
        <div class="role-card" data-role="student" onclick="startStudent()">
          <div class="rc-top"><div class="rc-icon"><i class="fas fa-user-graduate"></i></div><div class="rc-tag">Mahasiswa</div></div>
          <h4>Scan QR Absensi</h4>
          <p>Verifikasi identitas Anda, lalu pindai QR Code yang ditampilkan dosen di depan kelas.</p>
          <div class="rc-features">
            <div><i class="fas fa-check"></i> Verifikasi NPM & Nama</div>
            <div><i class="fas fa-check"></i> Scan lewat kamera HP</div>
            <div><i class="fas fa-check"></i> Anti duplikat kehadiran</div>
          </div>
          <div class="rc-cta">Mulai Scan <i class="fas fa-arrow-right"></i></div>
        </div>
        <div class="role-card" data-role="admin" onclick="startAdmin()">
          <div class="rc-top"><div class="rc-icon"><i class="fas fa-chalkboard-teacher"></i></div><div class="rc-tag">Dosen / Admin</div></div>
          <h4>Buat QR & Kelola</h4>
          <p>Buat satu sesi QR untuk pertemuan hari ini dan pantau kehadiran mahasiswa real-time.</p>
          <div class="rc-features">

            <div><i class="fas fa-check"></i> Auto-expired 30 menit</div>
            <div><i class="fas fa-check"></i> Rekap & filter lengkap</div>
          </div>

}

/*******************************************************
 * STUDENT
 *******************************************************/
function startStudent(){ state.user='student'; render('student-form'); }

function viewStudentForm(){
  const today = new Date().toISOString().slice(0,10);
  return `
    <nav class="navbar">
      <div class="nav-logo"><div class="logo-mark"><i class="fas fa-qrcode"></i></div><div><h1>Smart Attendance</h1><p>Portal Mahasiswa</p></div></div>
      <div class="nav-links"><a onclick="render('landing')"><i class="fas fa-arrow-left"></i> Kembali</a></div>
    </nav>
    <div class="page-shell">

        <div class="step active"><span class="num">1</span> Verifikasi Identitas</div>

            <div class="field"><label>Nama Lengkap <span class="req">*</span></label><div class="input-wrap"><i class="fas fa-user pre"></i><input class="input" id="inNama" placeholder="Nama sesuai KTM" autocomplete="off"></div></div>

function submitStudent(e){
  e.preventDefault();
  const npm = document.getElementById('inNpm').value.trim();

function startCamera(){
  const video = document.getElementById('video');
  if(!video) return;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      state.videoStream = stream;
      video.srcObject = stream;
      video.setAttribute('playsinline', true);
      video.play();
      requestAnimationFrame(scanTick);
    })
    .catch(err => {
      const a = document.getElementById('scanAlert');
      if(a){ a.classList.add('show'); a.querySelector('span').textContent = 'Tidak dapat mengakses kamera: ' + err.message; }
      toast('Kamera tidak dapat diakses', 'error');
    });
}

function scanTick(){
  const video = document.getElementById('video');
  if(!video || !state.videoStream) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(img.data, img.width, img.height);
    if(code && code.data){
      stopCamera();
      handleScanned(code.data);
      return;
    }
  }
  state.scanLoop = requestAnimationFrame(scanTick);
}

function stopCamera(){
  if(state.scanLoop){ cancelAnimationFrame(state.scanLoop); state.scanLoop = null; }
  if(state.videoStream){
    state.videoStream.getTracks().forEach(t => t.stop());
    state.videoStream = null;
  }
}

function handleScanned(qrData){
  toast('QR terdeteksi, memproses...', 'success', 'Berhasil Scan');
  const s = state.verifiedStudent;
  callServer('submitAttendance', { qrToken: qrData, npm: s.npm, nama: s.nama }).then(res => {
    if(res.success){
      state.lastAbsen = res.data;
      render('student-done');
    } else {
      toast(res.message || 'Absensi gagal', 'error');
      setTimeout(() => { if(state.view === 'student-scan') startCamera(); }, 1400);
    }
  });
}

        <div class="trow"><span>Berlaku s/d</span><span>${new Date(expiredAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</span></div>
        <div class="trow"><span>Pertemuan</span><span>${hitungPertemuan(state.selectedDate)}</span></div>
      </div>
      <div class="qr-holder">
        <div id="qrcode"></div>
        <div class="qr-hint"><i class="fas fa-expand"></i> Tampilkan QR ini di layar kelas</div>
      </div>
    </div>
    <div class="qr-side-info">
      <div class="info-card">
        <h4><i class="fas fa-clock"></i> Hitung Mundur</h4>
        <div id="countdown" style="font-size:28px;font-weight:800;color:var(--navy-800);font-family:'Poppins',sans-serif">--:--</div>
        <p class="small-muted" style="margin-top:6px">QR otomatis kedaluwarsa setelah 30 menit.</p>
      </div>
      <div class="info-card">
        <h4><i class="fas fa-circle-info"></i> Petunjuk</h4>
        <ul>
          <li><i class="fas fa-check"></i> Tampilkan QR ini di proyektor/layar kelas.</li>
          <li><i class="fas fa-check"></i> Mahasiswa memindai lewat HP masing-masing.</li>
          <li><i class="fas fa-check"></i> Hanya 1 QR per pertemuan — mahasiswa tidak bisa absen 2x.</li>
        </ul>
      </div>
      <button class="btn btn-danger btn-block" onclick="closeCurrentSession()" id="btnCloseSession"><i class="fas fa-stop"></i> Tutup Sesi Sekarang</button>
    </div>
  `;
  const box = document.getElementById('qrcode');
  await generateQR(box, qrToken, 220);
  startCountdown(new Date(expiredAt));
}

function startCountdown(expiredAt){
  if(state.countdownTimer) clearInterval(state.countdownTimer);
  const el = document.getElementById('countdown');
  if(!el) return;
  function tick(){
    const diff = Math.max(0, Math.floor((expiredAt - new Date()) / 1000));
    const m = String(Math.floor(diff / 60)).padStart(2,'0');
    const s = String(diff % 60).padStart(2,'0');
    el.textContent = m + ':' + s;
    if(diff === 0){
      clearInterval(state.countdownTimer);
      state.countdownTimer = null;
      el.textContent = 'Kedaluwarsa';
      el.style.color = 'var(--red)';
    }
  }
  tick();
  state.countdownTimer = setInterval(tick, 1000);
}

function closeCurrentSession(){
  if(!state.sessionId){ toast('Tidak ada sesi aktif', 'warning'); return; }
  if(!confirm('Tutup sesi QR sekarang? Mahasiswa tidak akan bisa absen lagi.')) return;
  callServer('closeSession', { token: state.authToken, sessionId: state.sessionId }).then(res => {
    if(res.success){
      toast('Sesi ditutup.', 'success');
      const el = document.getElementById('qrResult');
      if(el) el.innerHTML = '';
      state.qrToken = null; state.sessionId = null;
      if(state.countdownTimer){ clearInterval(state.countdownTimer); state.countdownTimer = null; }
      const sesiEl = document.getElementById('dashSesi');
      if(sesiEl) sesiEl.textContent = 'Belum Aktif';
    } else toast(res.message || 'Gagal menutup sesi', 'error');
  });
}

function loadAttendance(){
  const tgl = document.getElementById('filterTanggal')?.value || state.selectedDate;
  state.selectedDate = tgl;
  const tbody = document.getElementById('tableBody');
  if(tbody) tbody.innerHTML = `<tr><td colspan="6"><div class="skeleton"><div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Memuat data...</p></div></td></tr>`;
  callServer('getAttendanceList', { token: state.authToken, sessionId: null }).then(res => {
    if(res.success) state.attendanceCache = res.data || [];
    else state.attendanceCache = [];
    renderTable();
    updateSummary();
  });
}

function renderTable(){
  const tbody = document.getElementById('tableBody');
  if(!tbody) return;
  const data = state.attendanceCache || [];
  const countEl = document.getElementById('tableCount');
  if(countEl) countEl.textContent = data.length + ' Mahasiswa';
  if(data.length === 0){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><div class="es-icon"><i class="fas fa-inbox"></i></div><h4>Belum Ada Kehadiran</h4><p>Belum ada mahasiswa yang tercatat hadir pada <strong>${formatTanggalShort(state.selectedDate)}</strong>.</p></div></td></tr>`;
    return;
  }
  const avatarClasses = ['','a2','a3','a4'];
  tbody.innerHTML = data.map((item, i) => {
    const nama = item.nama || '-';
    const npm = item.npm || '-';
    const mk = item.matakuliah || MATAKULIAH;
    const waktu = item.timestamp || item.waktu || '-';
    const status = item.status || 'VALID';
    const av = avatarClasses[i % 4];
    let badge = '<span class="badge badge-hadir"><i class="fas fa-circle"></i> Hadir</span>';
    if(status === 'DUPLICATE') badge = '<span class="badge badge-telat"><i class="fas fa-circle"></i> Duplikat</span>';
    else if(status === 'INVALID') badge = '<span class="badge badge-absen"><i class="fas fa-circle"></i> Invalid</span>';
    return `<tr><td>${i+1}</td><td><div class="avatar-cell"><div class="avatar ${av}">${initialOf(nama)}</div><div class="name">${esc(nama)}</div></div></td><td><strong style="color:var(--navy-900)">${esc(npm)}</strong></td><td>${esc(mk)}</td><td>${esc(waktu)}</td><td>${badge}</td></tr>`;
  }).join('');
}

function filterTable(){
  const q = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  document.querySelectorAll('#tableBody tr').forEach(row => {
    row.style.display = (!q || row.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

function updateSummary(){
  const total = state.attendanceCache.length;
  const setEl = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  setEl('dashHadir', total);
  setEl('dashBelum', 0);
  const sesiEl = document.getElementById('dashSesi');
  if(sesiEl) sesiEl.textContent = state.sessionId ? 'Aktif' : 'Belum Aktif';
}

function onFilterChange(){
  state.selectedDate = document.getElementById('filterTanggal').value;
  loadAttendance();
}

function loadStudents(){
  const tbody = document.getElementById('studentsBody');
  if(tbody) tbody.innerHTML = `<tr><td colspan="3"><div class="skeleton"><div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Memuat data...</p></div></td></tr>`;
  callServer('getAllStudents', { token: state.authToken }).then(res => {
    if(res.success) state.studentsCache = res.data || [];
    else state.studentsCache = [];
    renderStudents();
  });
}

function renderStudents(){
  const tbody = document.getElementById('studentsBody');
  if(!tbody) return;
  const data = state.studentsCache || [];
  const countEl = document.getElementById('studentsCount');
  const totalEl = document.getElementById('totalStudents');
  if(countEl) countEl.textContent = data.length + ' Mahasiswa';
  if(totalEl) totalEl.textContent = data.length;
  if(data.length === 0){
    tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state"><div class="es-icon"><i class="fas fa-users"></i></div><h4>Belum Ada Mahasiswa</h4><p>Tambahkan mahasiswa melalui form di atas agar mereka dapat melakukan absensi.</p></div></td></tr>`;
    return;
  }
  tbody.innerHTML = data.map((s,i) => `<tr><td>${i+1}</td><td><strong style="color:var(--navy-900)">${esc(s.npm)}</strong></td><td>${esc(s.nama)}</td></tr>`).join('');
}

function addNewStudent(){
  const npm = document.getElementById('addNpm').value.trim();
  const nama = document.getElementById('addNama').value.trim();
  const alertBox = document.getElementById('addAlert');
  const showError = (msg) => { alertBox.classList.add('show'); alertBox.querySelector('span').textContent = msg; toast(msg,'error'); };
  if(!npm) return showError('NPM wajib diisi');
  if(!nama) return showError('Nama wajib diisi');
  alertBox.classList.remove('show');
  callServer('addStudent', { token: state.authToken, npm: npm, nama: nama }).then(res => {
    if(res.success){
      document.getElementById('addNpm').value = '';
      document.getElementById('addNama').value = '';
      toast('Mahasiswa ditambahkan!', 'success');
      loadStudents();
    } else showError(res.message || 'Gagal menambahkan');
  });
}

function doLogout(){
  const token = state.authToken;
  callServer('logout', { token: token }).then(() => {
    state.authToken = null; state.authRole = null;
    sessionStorage.removeItem('authToken');
    sessionStorage.removeItem('authRole');
    toast('Anda telah logout', 'success');
    render('landing');
  });
}

/*******************************************************
 * BOOT
 *******************************************************/
document.addEventListener('DOMContentLoaded', () => {
  if(SERVER_PAGE === 'student'){ state.user='student'; render('student-form'); }
  else if(SERVER_PAGE === 'login'){ state.user='admin'; render('admin-login'); }
  else if(SERVER_PAGE === 'lecturer'){
    if(state.authToken){ state.user='admin'; render('admin-dash'); }
    else { window.location.href = '?page=login'; }
  }
  else { render('landing'); }
});
</script>
</body>
</html>
